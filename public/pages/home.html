<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Eatz</title>
    <link rel="stylesheet" href="/style.css"> 
</head>
<body>
    <header class="navbar is-solid" id="main-navbar">
        <div class="navbar__container">
            <a href="/home" class="navbar__brand">Eatz</a>
            <button class="navbar__toggle" id="navbarToggle" aria-label="Abrir navegación" aria-expanded="false" aria-controls="navbarMenu">
                <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            </button>
            <nav id="navbarMenu" class="navbar__menu" role="navigation">
                <ul class="navbar__list">
                    <li class="navbar__item"><a href="/menu" class="navbar__link">Menú</a></li>
                    <li class="navbar__item"><a href="/restaurants" class="navbar__link">Restaurantes</a></li>
                    <li class="navbar__item"><a href="/carrito" class="navbar__link">Carrito</a></li>
                    <li class="navbar__item"><a href="/perfil" class="navbar__link">Mi Perfil</a></li>
                    <li class="navbar__item"><a href="/" class="navbar__link">Cerrar sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-main">
        <h1>Inicio</h1>
        <p>Explora restaurantes y agrega tus platillos favoritos al carrito.</p>
        <p>Esta navegación está disponible para el usuario autenticado.</p>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const navbarToggle = document.getElementById('navbarToggle');
        const navbarMenu = document.getElementById('navbarMenu');
        const mainNavbar = document.getElementById('main-navbar');
        let lastScrollY = window.scrollY;

        if (navbarToggle && navbarMenu) {
            navbarToggle.addEventListener('click', () => {
                const isActive = navbarMenu.classList.toggle('is-active');
                navbarToggle.setAttribute('aria-expanded', String(isActive));
                navbarToggle.setAttribute('aria-label', isActive ? 'Cerrar navegación' : 'Abrir navegación');
            });
        }

        if (mainNavbar) {
            window.addEventListener('scroll', () => {
                const currentScrollY = window.scrollY;
                mainNavbar.classList.toggle(
                    'is-hidden',
                    currentScrollY > lastScrollY && currentScrollY > mainNavbar.offsetHeight
                );
                lastScrollY = currentScrollY;
            }, { passive: true });
        }
    });
    </script>
</body>
</html>
