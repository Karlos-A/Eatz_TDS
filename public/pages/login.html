}
/* Chrome maps the hidden attribute to display:none below author styles, so the
   revert above would show every hidden element. Put it back at the weight of
   one class: the snippet's own class rules can still override it, as they
   could the browser default. */
:where(html) [hidden]:where(:not([hidden="until-found" i])) {

}

}

}

}

  border-style: revert;

.cl-icon {
  height: 1em;
  width: auto;
  fill: currentColor;
  display: inline-block;
}

body {
  margin: 0;
}

.cl-login04 {
  --cl-login04-ink: var(--eatz-white);
  --cl-login04-soft: var(--eatz-gray);
  --cl-login04-glass: color-mix(in srgb, var(--eatz-white) 14%, transparent);
  --cl-login04-edge: color-mix(in srgb, var(--eatz-white) 34%, transparent);
  --cl-login04-field: color-mix(in srgb, var(--eatz-white) 16%, transparent);
  --cl-login04-solid: var(--eatz-olive-dark);
  --cl-login04-error: var(--eatz-yellow);
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 440px);
  gap: clamp(32px, 6vw, 96px);
  align-items: center;
  min-height: 100vh;
  box-sizing: border-box;
  padding: 48px clamp(16px, 7vw, 120px);
  overflow: hidden;
  background-color: var(--cl-login04-solid);
  
  background-image: url("../images/Food\ Courd_\ Cooking.\ Dishes\ from\ different\ countries.\ Tasty\ and\ beautiful.\ Appetizing\ pictures_");
  
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  color: var(--cl-login04-ink);
  line-height: 1.5;
  isolation: isolate;
}

.cl-login04 *,
.cl-login04 *::before,
.cl-login04 *::after {
  box-sizing: border-box;
}

.cl-login04 [hidden] {
  display: none !important;
}

.cl-login04::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(100deg, color-mix(in srgb, var(--eatz-purple-dark) 55%, transparent), color-mix(in srgb, var(--eatz-purple-dark) 15%, transparent) 60%, color-mix(in srgb, var(--eatz-purple-dark) 35%, transparent));
}

.cl-login04__bg {
  position: absolute;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.cl-login04__brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--eatz-white);
  font-size: 22px;
  font-weight: 600;
  text-decoration: none;
  border-radius: 8px;
}

.cl-login04__kicker {
  margin: 48px 0 10px;
  color: var(--cl-login04-soft);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.cl-login04__headline {
  max-width: 15ch;
  margin: 0 0 28px;
  font-size: clamp(34px, 5vw, 64px);
  font-weight: 600;
  letter-spacing: -.03em;
  line-height: 1.02;
  text-shadow: 0 2px 30px color-mix(in srgb, var(--eatz-purple-dark) 30%, transparent);
}

.cl-login04__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.cl-login04__chips li {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 14px 6px 8px;
  border: 1px solid var(--cl-login04-edge);
  border-radius: 999px;
  background: color-mix(in srgb, var(--eatz-olive) 45%, transparent);
  font-size: 14px;
  font-weight: 500;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}

.cl-login04__chips li span {
  width: 16px;
  height: 16px;
  margin-right: -8px;
  border: 2px solid color-mix(in srgb, var(--eatz-white) 80%, transparent);
  border-radius: 50%;
}

.cl-login04__chips li span:nth-child(3) {
  margin-right: 6px;
}

.cl-login04__glass {
  padding: clamp(24px, 5vw, 40px);
  border: 1px solid var(--cl-login04-edge);
  border-radius: 28px;
  background: var(--cl-login04-glass);
  box-shadow: 0 30px 60px -20px color-mix(in srgb, var(--eatz-purple-dark) 55%, transparent), inset 0 1px 0 color-mix(in srgb, var(--eatz-white) 35%, transparent);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  backdrop-filter: blur(24px) saturate(160%);
}

@supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .cl-login04__glass {
    background: var(--cl-login04-solid);
  }
}

@media (prefers-reduced-transparency: reduce) {
  .cl-login04__glass {
    background: var(--cl-login04-solid);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

.cl-login04__title {
  margin: 0 0 4px;
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -.02em;
}

.cl-login04__sub {
  margin: 0 0 26px;
  color: var(--cl-login04-soft);
  font-size: 16px;
}

.cl-login04__field {
  margin-bottom: 16px;
}

.cl-login04__label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 500;
}

.cl-login04__input {
  display: block;
  width: 100%;
  min-height: 50px;
  padding: 12px 16px;
  border: 1px solid color-mix(in srgb, var(--eatz-white) 30%, transparent);
  border-radius: 14px;
  background: var(--cl-login04-field);
  color: var(--eatz-white);
  font: inherit;
  font-size: 16px;
  transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
}

.cl-login04__input::placeholder {
  color: color-mix(in srgb, var(--eatz-white) 72%, transparent);
}

.cl-login04__input:hover {
  border-color: color-mix(in srgb, var(--eatz-white) 50%, transparent);
}

.cl-login04__input:focus {
  outline: none;
  border-color: var(--eatz-white);
  background: color-mix(in srgb, var(--eatz-white) 22%, transparent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--eatz-white) 22%, transparent);
}

.cl-login04__pw {
  position: relative;
}

.cl-login04__pw .cl-login04__input {
  padding-right: 54px;
}

.cl-login04__eye {
  position: absolute;
  top: 5px;
  right: 5px;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--eatz-white);
  cursor: pointer;
}

.cl-login04__eye:hover {
  background: color-mix(in srgb, var(--eatz-white) 16%, transparent);
}

.cl-login04__eye-off,
.cl-login04__eye[aria-pressed="true"] .cl-login04__eye-on {
  display: none;
}

.cl-login04__eye[aria-pressed="true"] .cl-login04__eye-off {
  display: block;
}

.cl-login04__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  margin: 4px 0 22px;
}

.cl-login04__check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  cursor: pointer;
}

.cl-login04__check input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--eatz-white);
}

.cl-login04__link {
  color: var(--eatz-white);
  font-size: 14px;
  font-weight: 500;
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--eatz-white) 50%, transparent);
  text-underline-offset: 3px;
  border-radius: 4px;
}

.cl-login04__link:hover {
  text-decoration-color: var(--eatz-white);
}

button.cl-login04__link {
  padding: 0;
  border: 0;
  background: transparent;
  font: inherit;
  cursor: pointer;
}

.cl-login04__submit {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 52px;
  border: 0;
  border-radius: 14px;
  background: var(--eatz-white);
  color: var(--eatz-olive-dark);
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 10px 30px -10px color-mix(in srgb, var(--eatz-purple-dark) 45%, transparent);
  transition: transform .15s ease, box-shadow .15s ease;
}

.cl-login04__submit:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 34px -10px color-mix(in srgb, var(--eatz-purple-dark) 50%, transparent);
}

.cl-login04__submit svg {
  transition: transform .15s ease;
}

.cl-login04__submit:hover svg {
  transform: translateX(3px);
}

.cl-login04__or {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0 16px;
  color: var(--cl-login04-soft);
  font-size: 13px;
}

.cl-login04__or::before,
.cl-login04__or::after {
  content: "";
  flex: 1;
  height: 1px;
  background: color-mix(in srgb, var(--eatz-white) 30%, transparent);
}

.cl-login04__social {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.cl-login04__icon-btn {
  display: grid;
  place-items: center;
  min-height: 48px;
  border: 1px solid color-mix(in srgb, var(--eatz-white) 30%, transparent);
  border-radius: 14px;
  background: color-mix(in srgb, var(--eatz-white) 10%, transparent);
  color: var(--eatz-white);
  cursor: pointer;
  transition: background-color .15s ease;
}

.cl-login04__icon-btn:hover {
  background: color-mix(in srgb, var(--eatz-white) 22%, transparent);
}

.cl-login04__foot {
  margin: 22px 0 0;
  color: var(--cl-login04-soft);
  font-size: 14px;
  text-align: center;
}

.cl-login04__brand:focus-visible,
.cl-login04__eye:focus-visible,
.cl-login04__check input:focus-visible,
.cl-login04__link:focus-visible,
.cl-login04__submit:focus-visible,
.cl-login04__icon-btn:focus-visible,
.cl-login04__ghost:focus-visible {
  outline: 3px solid var(--eatz-white);
  outline-offset: 3px;
}

.cl-login04__error {
  display: inline-block;
  margin: 8px 0 0;
  padding: 3px 10px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--eatz-brown) 75%, transparent);
  color: var(--cl-login04-error);
  font-size: 13px;
  font-weight: 500;
}

.cl-login04__error:empty {
  display: none;
}

.cl-login04__field.is-error .cl-login04__input {
  border-color: var(--eatz-yellow);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--eatz-yellow) 30%, transparent);
}

.cl-login04__live:not(:empty) {
  margin-top: 16px;
  padding: 10px 14px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--eatz-olive) 55%, transparent);
  font-size: 14px;
}

.cl-login04__demo {
  margin: 14px 0 0;
  color: var(--cl-login04-soft);
  font-size: 12px;
  text-align: center;
}

.cl-login04__done {
  text-align: center;
}

.cl-login04__done:focus {
  outline: none;
}

.cl-login04__done:focus-visible {
  outline: 3px solid var(--eatz-white);
  outline-offset: 8px;
  border-radius: 16px;
}

.cl-login04__swatches {
  display: inline-flex;
  margin: 8px 0 18px;
}

.cl-login04__swatches span {
  width: 40px;
  height: 40px;
  margin-left: -10px;
  border: 3px solid var(--eatz-white);
  border-radius: 50%;
  background: var(--eatz-orange);
}

.cl-login04__swatches span:first-child {
  margin-left: 0;
}

.cl-login04__swatches span:nth-child(2) {
  background: var(--eatz-yellow);
}

.cl-login04__swatches span:nth-child(3) {
  background: var(--eatz-blue);
}

.cl-login04__swatches span:nth-child(4) {
  background: var(--eatz-brown);
}

.cl-login04__ghost {
  min-height: 46px;
  padding: 0 20px;
  border: 1px solid color-mix(in srgb, var(--eatz-white) 45%, transparent);
  border-radius: 14px;
  background: color-mix(in srgb, var(--eatz-white) 12%, transparent);
  color: var(--eatz-white);
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}

@media (max-width: 900px) {
  .cl-login04 {
    grid-template-columns: minmax(0, 1fr);
    padding-top: 32px;
  }

  .cl-login04__kicker {
    margin-top: 28px;
  }

  .cl-login04__headline {
    font-size: 34px;
    margin-bottom: 18px;
  }

  .cl-login04__chips {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .cl-login04 *,
  .cl-login04 *::before,
  .cl-login04 *::after {
    transition: none !important;
    animation: none !important;
  }
}
    </style>

/* The page's own script, unchanged: it never needed jQuery. */
(() => {
  'use strict';

  const root = document.querySelector('.cl-login04');
  if (!root) return;

  const live = root.querySelector('[data-live]');
  const title = root.querySelector('#cl-login04-title');
  const subtitle = root.querySelector('[data-auth-subtitle]');
  const toggle = root.querySelector('[data-auth-toggle]');
  const footText = root.querySelector('[data-auth-foot-text]');
  const loginForm = root.querySelector('#login-form');
  const registerForm = root.querySelector('#register-form');
  let mode = 'login';

  root.querySelectorAll('[data-pw-toggle]').forEach((button) => {
    const input = document.getElementById(button.getAttribute('aria-controls'));
    button.addEventListener('click', () => {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      button.setAttribute('aria-pressed', String(show));
      button.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });
  });

  const setMode = (nextMode) => {
    mode = nextMode;
    const isRegister = mode === 'register';
    loginForm.hidden = isRegister;
    registerForm.hidden = !isRegister;
    title.textContent = isRegister ? 'Crear cuenta' : 'Iniciar sesión';
    subtitle.textContent = isRegister ? 'Únete a Eatz.' : 'Qué bueno verte nuevamente.';
    footText.textContent = isRegister ? '¿Ya tienes cuenta?' : '¿Aún no tienes cuenta?';
    toggle.textContent = isRegister ? 'Iniciar sesión' : 'Crear cuenta';
    live.textContent = '';
    (isRegister ? registerForm.elements.name : loginForm.elements.email).focus();
  };

  toggle.addEventListener('click', () => {
    setMode(mode === 'login' ? 'register' : 'login');
  });

  root.querySelectorAll('[data-form]').forEach((form) => {
    const fields = Array.from(form.querySelectorAll('[data-field]'));

    const messageFor = (input) => {
      const value = input.value.trim();
      if (input.required && !value) return input.dataset.msg || 'Este campo es obligatorio.';
      if (input.validity.typeMismatch) return 'Ese correo electrónico no parece válido.';
      if (input.minLength > 0 && input.value.length < input.minLength) {
        return `Debe tener al menos ${input.minLength} caracteres.`;
      }
      return '';
    };

    const check = (field) => {
      const input = field.querySelector('input');
      const message = messageFor(input);
      field.querySelector('[data-error]').textContent = message;
      field.classList.toggle('is-error', !!message);
      if (message) input.setAttribute('aria-invalid', 'true');
      else input.removeAttribute('aria-invalid');
      return !message;
    };

    fields.forEach((field) => {
      field.addEventListener('focusout', (event) => {
        if (field.contains(event.relatedTarget) || !field.querySelector('input').value) return;
        field.dataset.touched = '1';
        check(field);
      });
      field.addEventListener('input', () => {
        if (field.dataset.touched) check(field);
      });
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      fields.forEach((field) => { field.dataset.touched = '1'; });
      const invalidFields = fields.filter((field) => !check(field));
      if (invalidFields.length) {
        live.textContent = 'Revisa los campos marcados.';
        invalidFields[0].querySelector('input').focus();
        return;
      }

      const isRegister = form.dataset.form === 'register';
      const payload = {
        email: form.elements.email.value.trim().toLowerCase(),
        password: form.elements.password.value
      };
      if (isRegister) payload.name = form.elements.name.value.trim();

      const submitButton = form.querySelector('[type="submit"]');
      submitButton.disabled = true;
      live.textContent = isRegister ? 'Creando tu cuenta...' : 'Iniciando sesión...';

      try {
        const response = await fetch(`/api/auth/${isRegister ? 'register' : 'login'}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'No fue posible continuar.');

        localStorage.setItem('eatz_token', result.data.token);
        localStorage.setItem('eatz_user', JSON.stringify(result.data.user));
        window.location.href = '/home';
      } catch (error) {
        live.textContent = error instanceof Error ? error.message : 'Ocurrió un error.';
        submitButton.disabled = false;
      }
    });
  });
})();
    </script>
</body>
